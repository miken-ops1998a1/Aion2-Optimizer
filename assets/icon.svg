<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 256 256"
     width="256"
     height="256"
     version="1.1">

  <title>Aion2 Optimizer Icon</title>
  <desc>Shield with lightning bolt — network &amp; frame stabilizer for AION 2</desc>

  <defs>
    <!-- Background radial gradient (subtle depth) -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%"   stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>

    <!-- Shield gradient (gold, top to bottom) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFE55C"/>
      <stop offset="45%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Accent ring gradient (network blue) -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <!-- Soft glow behind the bolt -->
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow for the shield -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4"
                    flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ============ Background circle ============ -->
  <circle cx="128" cy="128" r="120"
          fill="url(#bgGrad)"
          stroke="url(#ringGrad)"
          stroke-width="6"/>

  <!-- Inner subtle ring -->
  <circle cx="128" cy="128" r="112"
          fill="none"
          stroke="#00A8E8"
          stroke-opacity="0.25"
          stroke-width="1.5"/>

  <!-- ============ Shield ============ -->
  <g filter="url(#shieldShadow)">
    <path d="M 68 62
             L 188 62
             L 188 138
             L 128 208
             L 68 138
             Z"
          fill="url(#shieldGrad)"
          stroke="#8B6914"
          stroke-width="2"
          stroke-linejoin="round"/>
  </g>

  <!-- Inner shield outline (highlight) -->
  <path d="M 76 70
           L 180 70
           L 180 134
           L 128 198
           L 76 134
           Z"
        fill="none"
        stroke="#FFF3A0"
        stroke-opacity="0.5"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- ============ Lightning bolt ============ -->
  <g filter="url(#boltGlow)">
    <path d="M 148 78
             L 106 138
             L 126 138
             L 108 196
             L 158 118
             L 134 118
             Z"
          fill="#0D1117"
          stroke="#000000"
          stroke-width="1"
          stroke-linejoin="round"/>
  </g>

  <!-- Bolt highlight (left edge) -->
  <path d="M 148 78
           L 106 138
           L 126 138
           L 118 168"
        fill="none"
        stroke="#00A8E8"
        stroke-opacity="0.35"
        stroke-width="1.5"
        stroke-linecap="round"/>

</svg>